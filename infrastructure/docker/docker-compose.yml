name: bizbot-ai

services:
  # ─── Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bizbot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - webhook-server
    networks:
      - bizbot-network
    restart: unless-stopped
    profiles:
      - prod

  # ─── Data Services ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bizbot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bizbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizbot_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bizbot_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - bizbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bizbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bizbot-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: bizbot-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bizbot_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bizbot_minio_pass}
    volumes:
      - minio_data:/data
    networks:
      - bizbot-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Observability ───────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: bizbot-otel
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - bizbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 20s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: bizbot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - bizbot-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bizbot-grafana
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - bizbot-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: bizbot-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - bizbot-network
    restart: unless-stopped

  # ─── Dev Tools ───────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bizbot-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bizbot.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - bizbot-network
    profiles:
      - dev-tools

  redis-insight:
    image: redis/redisinsight:latest
    container_name: bizbot-redis-insight
    ports:
      - "8001:5540"
    networks:
      - bizbot-network
    profiles:
      - dev-tools

  mailpit:
    image: axllent/mailpit:latest
    container_name: bizbot-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - bizbot-network
    profiles:
      - dev-tools

  # ─── App Placeholders (run via pnpm dev outside Docker for HMR) ──
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: bizbot-web
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - bizbot-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
    profiles:
      - prod

  webhook-server:
    build:
      context: ../..
      dockerfile: apps/webhook-server/Dockerfile
    container_name: bizbot-webhook-server
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bizbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    profiles:
      - prod

  ai-worker:
    build:
      context: ../..
      dockerfile: apps/ai-worker/Dockerfile
    container_name: bizbot-ai-worker
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bizbot-network
    restart: unless-stopped
    profiles:
      - prod

  notification-worker:
    build:
      context: ../..
      dockerfile: apps/notification-worker/Dockerfile
    container_name: bizbot-notification-worker
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bizbot-network
    restart: unless-stopped
    profiles:
      - prod

networks:
  bizbot-network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
  prom_data:
  grafana_data:
  loki_data:
